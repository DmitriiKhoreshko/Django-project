{% extends "admin/base_site.html" %}
{% block content %}
<div class="content-main">
    <h1>Массовое удаление каналов</h1>
    <p>Вставьте ссылки на каналы (по одной в строке). Скрипт найдет совпадения по ID и удалит их из базы.</p>
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="submit-row">
            <input type="submit" value="Подтвердить удаление" class="default" style="background: #ba2121;">
        </div>
    </form>
</div>
{% endblock %}
